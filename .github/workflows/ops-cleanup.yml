name: ops-cleanup

# 一次性运维任务：
#   1. 清理 Release v1.1.1 上旧命名的冗余资产，使资产与下载页 8 个链接一一对应
#   2. 开启 GitHub Pages（main 分支 /docs 目录），让下载页 https://biolmz.github.io/bili-crawler/ 可访问
# 跑完即可删除本文件。

on:
  push:
    paths:
      - '.github/workflows/ops-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean release assets & enable Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          TOK = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]
          TAG = "v1.1.1"
          BASE = "https://api.github.com"

          KEEP = {
              "BiliCrawler-Setup.exe",
              "BiliCrawler-Windows-portable.zip",
              "BiliCrawler-macos-arm64.dmg",
              "BiliCrawler-macos-x86_64.dmg",
              "bilicrawler_amd64.deb",
              "bilicrawler_arm64.deb",
              "BiliCrawler-linux-x86_64.tar.gz",
              "BiliCrawler-linux-aarch64.tar.gz",
          }

          def api(path, method="GET", payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  BASE + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOK}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ops-cleanup",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read().decode()
                      return r.status, (json.loads(raw) if raw.strip() else None)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          # ---------- 1. 清理冗余资产 ----------
          st, rel = api(f"/repos/{REPO}/releases/tags/{TAG}")
          if st != 200:
              print(f"!! 取 release 失败 {st}: {rel}")
              raise SystemExit(1)

          st, assets = api(f"/repos/{REPO}/releases/{rel['id']}/assets?per_page=100")
          print(f"release {TAG} 现有资产 {len(assets)} 个")

          deleted = 0
          for a in assets:
              name = a["name"]
              if name in KEEP:
                  print(f"  keep   {name}")
                  continue
              # 只删带版本号旧命名的，避免误伤
              if "1.1.1" not in name:
                  print(f"  skip   {name} (命名不在白名单模式)")
                  continue
              code, _ = api(f"/repos/{REPO}/releases/assets/{a['id']}", method="DELETE")
              print(f"  delete {name} -> {code}")
              deleted += code in (204, 200)

          print(f"已删除 {deleted} 个冗余资产")

          st, assets = api(f"/repos/{REPO}/releases/{rel['id']}/assets?per_page=100")
          names = sorted(a["name"] for a in assets)
          print(f"\n清理后剩余 {len(names)} 个：")
          for n in names:
              print("  -", n)
          missing = KEEP - set(names)
          print("缺失（下载页引用但 Release 没有）:", sorted(missing) or "无")

          # ---------- 2. 开启 GitHub Pages ----------
          st, info = api(f"/repos/{REPO}/pages")
          if st == 200:
              print(f"\nPages 已启用: {info.get('html_url')}  状态 {info.get('status')}")
          else:
              st2, info2 = api(
                  f"/repos/{REPO}/pages",
                  method="POST",
                  payload={"source": {"branch": "main", "path": "/docs"}},
              )
              if st2 in (201, 200, 204):
                  print(f"\nPages 已创建（main:/docs）: {info2.get('html_url') if isinstance(info2, dict) else ''}")
              else:
                  print(f"\n!! 开启 Pages 失败 {st2}: {info2}")
          PY
