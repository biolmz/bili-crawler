name: ops-cleanup

# 一次性运维任务：
#   1. 清理 Release v1.1.1 上旧命名的冗余资产，使资产与下载页 8 个链接一一对应
#   2. 尝试开启 GitHub Pages（main 分支 /docs 目录）
#   3. 把上面的结果写进 ops-report.txt 提交回仓库，便于外部（无需 token）核对
# 跑完即可删除本文件与 ops-report.txt。

on:
  push:
    paths:
      - '.github/workflows/ops-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean release assets & enable Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          TOK = os.environ["GH_TOKEN"]
          REPO = os.environ["REPO"]
          TAG = "v1.1.1"
          BASE = "https://api.github.com"
          REPORT = []

          KEEP = [
              "BiliCrawler-Setup.exe",
              "BiliCrawler-Windows-portable.zip",
              "BiliCrawler-macos-arm64.dmg",
              "BiliCrawler-macos-x86_64.dmg",
              "bilicrawler_amd64.deb",
              "bilicrawler_arm64.deb",
              "BiliCrawler-linux-x86_64.tar.gz",
              "BiliCrawler-linux-aarch64.tar.gz",
          ]

          def log(s):
              print(s)
              REPORT.append(s)

          def api(path, method="GET", payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  BASE + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOK}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ops-cleanup",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read().decode()
                      return r.status, (json.loads(raw) if raw.strip() else None)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          # ---------- 1. 清理冗余资产 ----------
          st, rel = api(f"/repos/{REPO}/releases/tags/{TAG}")
          log(f"[assets] get release -> {st}")
          if st == 200:
              st, assets = api(f"/repos/{REPO}/releases/{rel['id']}/assets?per_page=100")
              log(f"[assets] before = {len(assets)}")
              for a in assets:
                  name = a["name"]
                  if name in KEEP:
                      log(f"  keep   {name}")
                      continue
                  if "1.1.1" not in name:
                      log(f"  skip   {name}")
                      continue
                  code, _ = api(f"/repos/{REPO}/releases/assets/{a['id']}", method="DELETE")
                  log(f"  delete {name} -> {code}")
              st, assets = api(f"/repos/{REPO}/releases/{rel['id']}/assets?per_page=100")
              names = sorted(a["name"] for a in assets)
              log(f"[assets] after = {len(names)}")
              for n in names:
                  log(f"  ok {n}")
              miss = [k for k in KEEP if k not in names]
              log(f"[assets] missing = {miss if miss else 'none'}")

          # ---------- 2. Pages ----------
          st, info = api(f"/repos/{REPO}/pages")
          log(f"\n[pages] GET -> {st}")
          if st != 200:
              st2, info2 = api(
                  f"/repos/{REPO}/pages",
                  method="POST",
                  payload={"source": {"branch": "main", "path": "/docs"}},
              )
              log(f"[pages] POST -> {st2}")
              log(f"[pages] body -> {json.dumps(info2, ensure_ascii=False)[:600]}")
              if st2 in (200, 201, 204):
                  st3, info3 = api(f"/repos/{REPO}/pages")
                  log(f"[pages] GET after POST -> {st3} {json.dumps(info3, ensure_ascii=False)[:400]}")
          else:
              log(f"[pages] already enabled: {json.dumps(info, ensure_ascii=False)[:400]}")

          with open("ops-report.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(REPORT) + "\n")
          PY

      - name: Commit report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-report.txt
          git diff --cached --quiet && echo "报告无变化" && exit 0
          git commit -m "chore: ops-report（release 资产与 Pages 状态）"
          git push
