name: build-macos

# 在 GitHub 的 macOS 机器上打 .app / .dmg（Windows 无法交叉编译）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/app.icns"
      - "gen_icon.py"
      - "packaging/macos/**"
      - ".github/workflows/build-macos.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14         # Apple Silicon
            arch: arm64
            py: brew
          - os: macos-15-intel   # Intel
            arch: x86_64
            py: setup-python
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 与 Tk（Homebrew，arm64）
        if: matrix.py == 'brew'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          # runner 上可能已存在 python@3.12，link 冲突不算失败，后面会验证 tkinter
          brew install python@3.12 python-tk@3.12 || true
          brew link --overwrite --force python@3.12 tcl-tk 2>/dev/null || true
          brew list --versions python@3.12 python-tk@3.12 || true

          P="$(brew --prefix python@3.12)/bin"
          echo "$P" >> "$GITHUB_PATH"
          echo "PYTHON=$P/python3.12" >> "$GITHUB_ENV"

      - name: 安装 Python 与 Tk（python.org 官方构建，Intel）
        if: matrix.py == 'setup-python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: 校验 tkinter
        shell: bash
        run: |
          if [ "${{ matrix.py }}" = "setup-python" ]; then
            PY="$(python -c 'import sys; print(sys.executable)')"
            echo "PYTHON=$PY" >> "$GITHUB_ENV"
          else
            PY="$PYTHON"
          fi
          echo "使用解释器：$PY"
          "$PY" -c "import tkinter, sys; print(sys.version.split()[0], '| Tk', tkinter.TkVersion)"

      - name: 构建 .app 与 .dmg
        run: bash packaging/macos/build_macos.sh --dmg

      - name: 校验产物架构
        run: |
          APP=dist/BiliCrawler.app
          file "$APP/Contents/MacOS/BiliCrawler"
          echo "--- 链接的 Tk ---"
          otool -L "$APP/Contents/MacOS/BiliCrawler" | grep -iE "tk|tcl" || true
          echo "--- Frameworks ---"
          ls "$APP/Contents/Frameworks" | head -20
          echo "--- 内置 ffmpeg ---"
          FF="$(find "$APP" -type f -name ffmpeg -perm -111 | head -1)"
          if [ -z "$FF" ]; then echo "✗ 未找到内置 ffmpeg"; exit 1; fi
          file "$FF"
          "$FF" -version | head -2
          codesign --verify --deep --strict "$APP" && echo "codesign ok"

      - name: 启动自检（真正建一次窗口）
        continue-on-error: true
        run: |
          # macOS 没有 GNU timeout，用 python 包一层超时
          "$PYTHON" - <<'EOF'
          import subprocess, sys
          exe = "dist/BiliCrawler.app/Contents/MacOS/BiliCrawler"
          try:
              p = subprocess.run([exe, "--self-test"], capture_output=True, text=True, timeout=90)
              print("exit:", p.returncode)
              print(p.stdout.strip())
              print(p.stderr.strip()[-1500:])
          except subprocess.TimeoutExpired:
              print("self-test 超时（可能卡在窗口创建）")
          EOF

      - name: 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: BiliCrawler-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: false
